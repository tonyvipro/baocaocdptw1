services:
  # 1. FRONTEND (ReactJS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: baocaocdptw1_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  # 2. BACKEND (Laravel 11 PHP)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: baocaocdptw1_backend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
      - APP_KEY=base64:nQmTyAa3vuHvoA3wE+XN3c91AknORJxL6S1ulYPCyBQ=
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=baocaocdptw1_db
      - DB_USERNAME=root
      - DB_PASSWORD=rootpassword
    command: >
      bash -c "if [ ! -f vendor/autoload.php ]; then echo 'Dang cai dat Composer dependencies...' && composer install --no-interaction --prefer-dist; fi && chmod -R 777 storage bootstrap/cache 2>/dev/null || true && apache2-foreground"
    depends_on:
      - db

  # 3. DATABASE (MySQL)
  db:
    image: mysql:8.0
    container_name: baocaocdptw1_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: baocaocdptw1_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 4. PHPMYADMIN (Database GUI Manager)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: baocaocdptw1_pma
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      - db

volumes:
  db_data:
