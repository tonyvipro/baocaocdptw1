name: Laravel CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-and-deploy:
    runs-on: self-hosted # Hoặc ubuntu-latest tùy bạn chọn
    
    steps:
      - name: Set up job
        run: echo "Starting deployment workflow..."

      - name: Checkout tested code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, pdo, sqlite, dom, fileinfo, pdo_mysql, mysqli
          coverage: none

      - name: Install Production Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Deployment
        run: |
          echo "Preparing files for deployment..."
          php -v

      - name: Push Build to Deployment / Sync Code
        run: |
          git pull origin master
          docker-compose down
          docker-compose up -d --build

      - name: Post Checkout tested code
        run: echo "Cleaning up temporary environment variables..."

      - name: Complete job
        run: echo "Deployment completed successfully!"