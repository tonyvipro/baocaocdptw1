name: Laravel CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Lay code
        uses: actions/checkout@v4

      - name: Cai PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.10'
          extensions: mbstring, bcmath, pdo, sqlite, dom, fileinfo, pdo_mysql, mysqli
          coverage: none

      - name: Cai thu vien Composer
        run: composer install --no-interaction --prefer-dist --no-progress

  deploy:
    needs: test
    runs-on: self-hosted # Chạy trên máy cá nhân đang mở run.cmd của bạn

    steps:
      - name: Pull code and restart Docker
        run: |
          git pull origin master
          docker-compose down
          docker-compose up -d --build
