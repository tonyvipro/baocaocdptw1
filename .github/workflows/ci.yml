name: Laravel CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Lay code
        uses: actions/checkout@v4

      - name: Cai PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.10'
          extensions: mbstring, bcmath, pdo, sqlite, dom, fileinfo, pdo_mysql, mysqli
          coverage: none

      - name: Cai thu vien Composer
        run: composer install --no-interaction --prefer-dist --no-progress

  deploy:
    needs: test
    runs-on: self-hosted 

    steps:
      - name: Pull latest code
        run: |
          git pull origin master

      - name: Restart Docker Containers
        run: |
          cd C:\wamp64\www\baocaocdptw1
          docker compose down
          docker compose up -d --build

          

