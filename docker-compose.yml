services:
  web:
    build: .
    container_name: baocaocdptw1_web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    command: >
      bash -c "if [ ! -f vendor/autoload.php ]; then
                 echo 'Dang tu dong cai dat vendor qua Composer...' &&
                 composer install --no-interaction --prefer-dist;
               fi &&
               chmod -R 777 storage bootstrap/cache 2>/dev/null || true &&
               apache2-foreground"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: baocaocdptw1_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: quanly_bds
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: baocaocdptw1_pma
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      - db

volumes:
  db_data:
