services:
  # 1. FRONTEND (ReactJS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: baocaocdptw1_frontend
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # 2. BACKEND (Laravel PHP)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: baocaocdptw1_backend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/public/uploads:/var/www/html/public/uploads
      - ./backend/storage/app/public:/var/www/html/storage/app/public
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
      - APP_KEY=base64:nQmTyAa3vuHvoA3wE+XN3c91AknORJxL6S1ulYPCyBQ=
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=baocaocdptw1_db
      - DB_USERNAME=root
      - DB_PASSWORD=rootpassword
      - SCOUT_DRIVER=meilisearch
      - SCOUT_QUEUE=false
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in the root .env file}
    command: >
      bash -c "if [ ! -f vendor/autoload.php ]; then echo 'Dang cai dat Composer dependencies...' && composer install --no-interaction --prefer-dist; fi && mkdir -p public/uploads/avatars storage/app/public storage/framework/{sessions,views,cache} bootstrap/cache && php artisan storage:link 2>/dev/null || true && chmod -R 777 storage bootstrap/cache public/uploads 2>/dev/null || true && apache2-foreground"
    depends_on:
      - db
      - meilisearch

  meilisearch:
    image: getmeili/meilisearch:v1.55.0
    container_name: baocaocdptw1_meilisearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:7700:7700"
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in the root .env file}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data

  # 3. DATABASE (MySQL Persistent)
  db:
    image: mysql:8.0
    container_name: baocaocdptw1_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: baocaocdptw1_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 4. PHPMYADMIN (Database GUI Manager)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: baocaocdptw1_pma
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      - db

volumes:
  db_data:
  meili_data:
