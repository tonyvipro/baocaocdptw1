name: Laravel & React CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-lint:
    name: Backend Syntax & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, mysql, pdo_mysql

      - name: Validate Composer Configuration
        working-directory: backend
        run: composer validate --strict --no-check-all

      - name: Check PHP Syntax (Lint)
        run: |
          echo "Scanning PHP files for syntax errors..."
          find backend/app backend/routes backend/config -name "*.php" -exec php -l {} +

  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Frontend
        working-directory: frontend
        run: npm run build
