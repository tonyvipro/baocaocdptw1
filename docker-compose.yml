services:
  web:
    image: php:8.5.10-apache
    container_name: baocaocdptw1_web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    command: >
      bash -c "docker-php-ext-install pdo_mysql mysqli &&
               sed -i 's!/var/www/html!/var/www/html/public!g' /etc/apache2/sites-available/000-default.conf &&
               sed -i 's!/var/www/!/var/www/html/public!g' /etc/apache2/apache2.conf &&
               apache2-foreground"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: baocaocdptw1_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: quanly_bds
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: